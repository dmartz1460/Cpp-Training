name: Build and Run C++ Code

on:

  workflow_dispatch:

    inputs: 

      executable_name:
        description: 'Name of the executable to run'
        type: choice
        options: 
          - Custom_Vector
        required: true

jobs:

  build-and-run:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
      with: 
        fetch-depth: 0

    - name: Setup Docker Compose
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: | 
        docker compose build docker-image

    - name: Run Executable
      run: |
        docker compose run --rm ${{ github.event.inputs.executable_name }}